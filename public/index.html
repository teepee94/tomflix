<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="A Netflix-style React front end built on the TMDB API by Tommy Parkinson." />
		<link rel="preconnect" href="https://image.tmdb.org" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&display=swap" rel="stylesheet">
		<script>
			// Adds "touchevents" / "no-touchevents" to <html> before first paint;
			// the SCSS uses html.no-touchevents to scope hover styles.
			document.documentElement.className = window.matchMedia("(hover: hover)").matches ? "no-touchevents" : "touchevents";
		</script>
		<link href="/favicon.ico" type="image/ico" rel="icon"/>
		<link rel="apple-touch-icon" href="%PUBLIC_URL%/resources/images/icons/apple-touch-icon.png"/>
		<link rel="manifest" href="%PUBLIC_URL%/resources/images/icons/manifest.json"/>
	</head>
	<body>
		<noscript>You need to enable JavaScript to run this app.</noscript>
		<div id="root"></div>
	</body>
</html>
